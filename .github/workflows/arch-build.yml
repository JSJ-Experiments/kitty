name: Build Arch package (bold_is_bright)

on:
  schedule:
    # every 6 hours; auto-rebases the patch on Arch's kitty version
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: arch-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --noconfirm --needed base-devel git go
          git config --global --add safe.directory '*'

      - name: Check out packaging repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Arch repo version
        id: archver
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl -s https://archlinux.org/packages/extra/x86_64/kitty/json/)"
          ver="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["pkgver"])')"
          rel="$(printf '%s' "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["pkgrel"])')"
          echo "pkgver=$ver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$rel" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Fetch upstream kitty tag and auto-rebase patch
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.archver.outputs.pkgver }}"
          git fetch --tags --force origin
          # fetch the exact upstream tag Arch tracks
          git fetch --tags --force https://github.com/kovidgoyal/kitty.git "refs/tags/v${ver}:refs/tags/v${ver}"
          # find the bold_is_bright feature commit (exists on this repo's branches)
          feature="$(git log --all --oneline --grep='implement bold_is_bright option' -1 --format='%H')"
          if [ -z "$feature" ]; then
            echo "Feature commit not found; build will use current checkout (already patched)"
            exit 0
          fi
          # rebase: new branch from the Arch-tracked tag + cherry-pick the feature
          git checkout -b auto-rebase "v${ver}"
          if ! git cherry-pick "$feature" --allow-empty; then
            echo "Cherry-pick had conflicts; trying patch apply fallback"
            git cherry-pick --abort || true
            git checkout -f -- .
            git cherry-pick -m 1 "$feature" || true
          fi
          # restore packaging files that only live on master
          for f in PKGBUILD .github/workflows/arch-build.yml; do
            git show "master:$f" > "$f" 2>/dev/null || true
          done
          git log --oneline -3

      - name: Update PKGBUILD version to match Arch repo
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.archver.outputs.pkgver }}"
          rel="${{ steps.archver.outputs.pkgrel }}"
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=$rel/" PKGBUILD
          echo "PKGBUILD now: pkgver=$ver pkgrel=$rel"

      - name: Build package (x86_64 only)
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.archver.outputs.pkgver }}"
          # package the patched tree as the source tarball makepkg expects.
          # Write to /tmp first (tar fails if it writes inside the dir it reads),
          # then copy into the workspace where makepkg looks for local sources.
          tar --exclude=.git --exclude=dist --exclude=src --exclude=pkg --exclude='*.tar.gz' \
            -czf "/tmp/kitty-$ver.tar.gz" -C "$GITHUB_WORKSPACE" --transform="s,^\./,kitty-$ver/," .
          cp "/tmp/kitty-$ver.tar.gz" "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE/kitty-$ver.tar.gz"
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          runuser -u builder -- bash -lc '
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            makepkg --syncdeps --noconfirm --cleanbuild --clean
          '

      - name: Collect build outputs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          shopt -s nullglob
          packages=( "$GITHUB_WORKSPACE"/*.pkg.tar.* )
          if (( ${#packages[@]} == 0 )); then
            echo "No package artifact was produced" >&2
            exit 1
          fi
          primary_package="$(basename "${packages[0]}")"
          echo "package_name=$primary_package" >> "$GITHUB_OUTPUT"
          for pkg in "${packages[@]}"; do
            base="$(basename "$pkg")"
            cp "$pkg" "$GITHUB_WORKSPACE/dist/$base"
            sha256sum "$pkg" > "$GITHUB_WORKSPACE/dist/$base.sha256"
          done
          git rev-parse HEAD > "$GITHUB_WORKSPACE/dist/commit.txt"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            ${{ github.workspace }}/dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/dist/*
          tag_name: arch-${{ steps.archver.outputs.pkgver }}-${{ steps.archver.outputs.pkgrel }}
          name: kitty ${{ steps.archver.outputs.pkgver }}-${{ steps.archver.outputs.pkgrel }} (bold_is_bright)
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          prerelease: true
          body: |
            Arch Linux x86_64 package build for:
            - Upstream: https://github.com/kovidgoyal/kitty (v${{ steps.archver.outputs.pkgver }})
            - Patch: bold_is_bright (https://github.com/ckabalan/kitty/commit/18876527f575cf995aa664bf2da22d9c13f28f58)
            - Arch repo version: ${{ steps.archver.outputs.pkgver }}-${{ steps.archver.outputs.pkgrel }}

            Install: `sudo pacman -U kitty-*.pkg.tar.zst`
